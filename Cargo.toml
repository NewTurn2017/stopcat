[workspace]
resolver = "3"
members = [
    "crates/vh-model",
    "crates/vh-sample",
    "crates/vh-analyze",
    "crates/vh-act",
    "crates/vh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
anyhow = "1"
tempfile = "3"
vh-model = { path = "crates/vh-model" }
vh-sample = { path = "crates/vh-sample" }
vh-analyze = { path = "crates/vh-analyze" }
vh-act = { path = "crates/vh-act" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
