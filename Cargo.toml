[workspace]
resolver = "3"
members = [
    "crates/stopcat-model",
    "crates/stopcat-sample",
    "crates/stopcat-analyze",
    "crates/stopcat-act",
    "crates/stopcat-guard",
    "crates/stopcat-cli",
    "crates/stopcat-lab",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/NewTurn2017/stopcat"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
anyhow = "1"
tempfile = "3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
stopcat-model = { path = "crates/stopcat-model" }
stopcat-sample = { path = "crates/stopcat-sample" }
stopcat-analyze = { path = "crates/stopcat-analyze" }
stopcat-act = { path = "crates/stopcat-act" }
stopcat-guard = { path = "crates/stopcat-guard" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
